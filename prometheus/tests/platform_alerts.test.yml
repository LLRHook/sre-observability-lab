---
rule_files:
  - ../rules/static/platform.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'pg_up{job="postgres",instance="postgres-exporter:9187"}'
        values: '1x20 0x20'
      - series: 'up{job="ticketing-api",instance="ticketing-api:8000"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: page
              service: postgres
              team: platform-sre
              job: postgres
              instance: postgres-exporter:9187
            exp_annotations:
              summary: "Page: Postgres is unreachable from postgres_exporter"
              description: "postgres_exporter reports pg_up == 0 for over a minute. Everything that depends on the database (ticketing-api purchases) will fail; the dependent SLO alerts are inhibited while this fires."
              runbook_url: http://localhost:8001/runbooks/postgres-down.md
              dashboard_url: http://localhost:3000/d/postgres/postgres
      - eval_time: 7m
        alertname: TargetDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="ticketing-api",instance="ticketing-api:8000"}'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: page
              service: ticketing-api
              team: platform-sre
              job: ticketing-api
              instance: ticketing-api:8000
            exp_annotations:
              summary: "Page: scrape target ticketing-api (ticketing-api:8000) is down"
              description: "Prometheus has not been able to scrape ticketing-api:8000 for 2 minutes. SLO alerts for this service are inhibited while it fires because the SLI has no data."
              runbook_url: http://localhost:8001/runbooks/target-down.md
              dashboard_url: http://localhost:3000/d/golden-signals/service-golden-signals
