---
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      manageAlerts: false

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: OpenSearch
    uid: opensearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    editable: false
    jsonData:
      # Daily indices named srelab-logs-YYYY.MM.DD (Fluent Bit logstash_format).
      database: "[srelab-logs-]YYYY.MM.DD"
      interval: Daily
      timeField: "@timestamp"
      flavor: opensearch
      version: "3.9.0"
      pplEnabled: true
      logMessageField: msg
      logLevelField: level
      maxConcurrentShardRequests: 5
      timeInterval: 5s
